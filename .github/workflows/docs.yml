name: Documentation
on:
  workflow_dispatch:
  pull_request:
    paths: ['docs/**', 'Documentation/**', 'Plugins/PrincipledNPR/Source/**', 'Tools/**', 'package*.json', '.github/workflows/docs.yml']
  push:
    branches: [main, dev]
    paths: ['docs/**', 'Documentation/**', 'Plugins/PrincipledNPR/Source/**', 'Tools/**', 'package*.json', '.github/workflows/docs.yml']
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: git lfs pull --include="Documentation/Outline/Guide/01-overview.png,Documentation/Outline/MaterialSlotUI/*.png,Documentation/Outline/MaterialSlotUI/*.jpg,Documentation/Outline/Temporal/Validation/Candidate1/Screen_Static100/000/*.png,Documentation/RimLight/BindingValidation/Wide25.png,Documentation/RimLight/BindingValidation/Red25.png,Documentation/Surface/Validation/*.png,Documentation/Editor/WorkspaceEvidence/**,Documentation/RimLight/OriginalSurface-2026-10-26/**,Documentation/RimLight/Integration-2026-10-26/**,docs/public/images/miku-hero.png"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
        env:
          DOCS_BASE: /PrincipledNPR/
      - name: Upload website
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
  deploy:
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v4
